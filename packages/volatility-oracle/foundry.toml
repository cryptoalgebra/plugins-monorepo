# Halmos specs for the pure libraries only, run locally with `halmos` from this directory.
# ast is required: without it halmos finds no specs.
[profile.default]
src = "halmos"
test = "halmos"
out = "halmos/artifacts"
cache_path = "halmos/cache"
libs = []
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 1_000_000
ast = true
